name: SourceDemo Automation Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: '30 18 * * 0'   # Monday 12:00 AM IST

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa

      test_suite:
        description: 'Select Test Suite'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression

jobs:

  test:

    runs-on: ubuntu-latest

    env:
      ENV: ${{ github.event.inputs.environment || 'qa' }}
      TEST_SUITE: ${{ github.event.inputs.test_suite || 'regression' }}

      BASE_URL: ${{ github.event.inputs.environment == 'dev' && secrets.DEV_BASE_URL || secrets.QA_BASE_URL }}

      USERNAME: ${{ github.event.inputs.environment == 'dev' && secrets.DEV_USERNAME || secrets.QA_USERNAME }}

      PASSWORD: ${{ github.event.inputs.environment == 'dev' && secrets.DEV_PASSWORD || secrets.QA_PASSWORD }}

    steps:

      # Get project code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install Java for Allure
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install npm packages
      - name: Install Dependencies
        run: npm ci

      # Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx --no-install playwright install --with-deps

      # Show selected environment and test suite
      - name: Show Test Configuration
        run: |
          echo "Environment: $ENV"
          echo "Test Suite: $TEST_SUITE"

      # Start application server
      - name: Start Application Server
        run: npm run start > app.log 2>&1 &

      # Check application startup log
      - name: Check Application Log
        run: |
          sleep 10
          cat app.log

      # Wait until application is ready
      - name: Wait for Application
        run: npx wait-on "$BASE_URL" --timeout 60000

      # Execute Playwright tests
      - name: Run Playwright Tests
        run: |
          if [ "$TEST_SUITE" = "smoke" ]; then
            npx playwright test --grep @smoke
          else
            npx playwright test --grep @regression
          fi

      # Generate Allure Report
      - name: Generate Allure Report
        if: always()
        run: |
          npx allure-commandline generate ./allure-results --clean -o ./allure-report

      # Upload Playwright HTML Report
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      # Upload Allure Report
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      # Upload Test Results
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/